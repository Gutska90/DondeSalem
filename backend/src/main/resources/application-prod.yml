# Perfil producción: activar con SPRING_PROFILES_ACTIVE=prod
# Ver docs/DEPLOYMENT_CHECKLIST.md y docs/RAILWAY.md
#
# Sin defaults: DATABASE_* deben existir en el entorno (Railway Variables).
# Si faltan o son placeholders, ProductionDatasourceEnvironmentPostProcessor falla al arrancar.

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  public-frontend-url: ${PUBLIC_FRONTEND_URL:}
  admin-bootstrap-token: ${ADMIN_BOOTSTRAP_TOKEN:}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MIN:20}
    contact-per-minute: ${RATE_LIMIT_CONTACT_PER_MIN:10}

logging:
  level:
    root: INFO
    com.dondesalem: INFO
