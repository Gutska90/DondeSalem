spring:
  application:
    name: dondesalem-api
  datasource:
    # Solo para desarrollo sin perfil o con variables en .env.
    # Producción (prod): sin defaults — ver application-prod.yml
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dondesalem}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

# OpenAPI / Swagger (desactivado en perfil `prod`)
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  public-frontend-url: ${PUBLIC_FRONTEND_URL:http://localhost:3000}
  admin-bootstrap-token: ${ADMIN_BOOTSTRAP_TOKEN:}
  transfer:
    # Datos de cuenta para transferencia (multilínea). Visible en GET /api/config/public y en el mail de pedido.
    bank-instructions: ${TRANSFER_BANK_INSTRUCTIONS:}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-use-long-random-string-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MIN:30}
    contact-per-minute: ${RATE_LIMIT_CONTACT_PER_MIN:15}
  auth:
    password-reset-expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MIN:60}
    # false = solo Google para clientes (recomendado en producción)
    password-login-enabled: ${PASSWORD_LOGIN_ENABLED:false}
  # OAuth web client id(s) de Google Cloud (comma-separated). Vacío = login con Google desactivado.
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:}
  totp:
    issuer: ${TOTP_ISSUER:DondeSalem}
    # JWT intermedio tras password/Google cuando el usuario tiene 2FA (ms)
    pending-expiration-ms: ${TOTP_PENDING_JWT_MS:300000}
  # Sincronización precio/imagen singles Mylserena desde classpath: mylserena-pe-singles.json + mylserena-pb-singles.json
  mylserena:
    sync:
      enabled: ${MYLSERENA_SYNC_ENABLED:false}
      cron: ${MYLSERENA_SYNC_CRON:0 0 4 * * *}

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    org.springframework.security: INFO
